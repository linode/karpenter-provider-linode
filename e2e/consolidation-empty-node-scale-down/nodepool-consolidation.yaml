apiVersion: karpenter.k8s.linode/v1alpha1
kind: LinodeNodeClass
metadata:
  name: empty
  labels:
    e2e.linode.dev/cleanup: "true"
spec: {}
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: empty
  labels:
    e2e.linode.dev/cleanup: "true"
spec:
  template:
    metadata:
      labels:
        e2e.linode.dev/empty: "true"
        e2e.linode.dev/cleanup: "true"
    spec:
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: e2e.linode.dev/empty
          operator: Exists
        - key: karpenter.k8s.linode/instance-memory
          operator: Lt
          values: ["8193"]
      taints:
        - key: e2e.linode.dev/test
          value: "true"
          effect: NoSchedule
      nodeClassRef:
        group: karpenter.k8s.linode
        kind: LinodeNodeClass
        name: empty
  limits:
    cpu: 1000

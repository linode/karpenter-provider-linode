apiVersion: karpenter.k8s.linode/v1alpha1
kind: LinodeNodeClass
metadata:
  name: storage-test
  labels:
    e2e.linode.dev/cleanup: "true"
spec: {}
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: storage-test
  labels:
    e2e.linode.dev/cleanup: "true"
spec:
  disruption:
    consolidateAfter: 30m
  template:
    metadata:
      labels:
        e2e.linode.dev/ephemeral-storage: "true"
        e2e.linode.dev/cleanup: "true"
    spec:
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["g6-standard-2"]
        - key: e2e.linode.dev/ephemeral-storage
          operator: Exists
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
      taints:
        - key: e2e.linode.dev/test
          value: "true"
          effect: NoSchedule
      nodeClassRef:
        group: karpenter.k8s.linode
        kind: LinodeNodeClass
        name: storage-test
      expireAfter: 720h
  limits:
    cpu: 1000

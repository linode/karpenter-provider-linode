apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: blockstorage-unconstrained
  namespace: "($namespace)"
  labels:
    e2e.linode.dev/cleanup: "true"
    e2e.linode.dev/blockstorage-topology: "true"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: e2e-blockstorage-wffc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: blockstorage-explicit
  namespace: "($namespace)"
  labels:
    e2e.linode.dev/cleanup: "true"
    e2e.linode.dev/blockstorage-topology: "true"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: e2e-blockstorage-wffc-explicit

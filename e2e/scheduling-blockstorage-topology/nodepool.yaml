apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: blockstorage-topology
  labels:
    e2e.linode.dev/cleanup: "true"
spec:
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 1m
  template:
    metadata:
      labels:
        e2e.linode.dev/blockstorage-topology: "true"
        e2e.linode.dev/cleanup: "true"
    spec:
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: e2e.linode.dev/blockstorage-topology
          operator: Exists
      taints:
        - key: e2e.linode.dev/test
          value: "true"
          effect: NoSchedule
      nodeClassRef:
        group: karpenter.k8s.linode
        kind: LinodeNodeClass
        name: default
      expireAfter: 720h
  limits:
    cpu: 1000

apiVersion: v1
kind: Pod
metadata:
  name: blockstorage-incompatible-consumer
  namespace: "($namespace)"
  labels:
    e2e.linode.dev/cleanup: "true"
    e2e.linode.dev/blockstorage-topology: "true"
spec:
  terminationGracePeriodSeconds: 0
  nodeSelector:
    e2e.linode.dev/blockstorage-topology: "true"
  tolerations:
    - key: e2e.linode.dev/test
      operator: Equal
      value: "true"
      effect: NoSchedule
  containers:
    - name: consumer
      image: mirror.registry.linodelke.net/k8s/pause:3.9
      resources:
        requests:
          cpu: 100m
      volumeMounts:
        - name: incompatible
          mountPath: /mnt/incompatible
  volumes:
    - name: incompatible
      persistentVolumeClaim:
        claimName: blockstorage-incompatible

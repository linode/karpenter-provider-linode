name: E2E setup
description: Common setup steps for E2E workflows

inputs:
  docker_username:
    description: Docker Hub username
    required: false
  mise_task:
    description: Optional mise task to run (without the leading "mise run")
    required: false
    default: ""
  cleanup_cluster:
    description: Whether to delete the LKE cluster via mise
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Login to Docker Hub
      if: ${{ inputs.docker_username != '' && env.DOCKERHUB_OIDC_CONNECTIONID != '' }}
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        username: ${{ inputs.docker_username }}

    - name: Set up Mise
      uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

    - name: Run mise task
      if: ${{ inputs.mise_task != '' }}
      run: mise run ${{ inputs.mise_task }}
      shell: bash

    - name: Delete LKE cluster
      if: ${{ inputs.cleanup_cluster == 'true' }}
      run: |
        CLUSTER_ID=$(mise run get-lke-cluster-id)
        if [ -n "$CLUSTER_ID" ]; then
          mise run destroy-lke-cluster "$CLUSTER_ID"
        else
          echo "No cluster found for cleanup"
        fi
      shell: bash

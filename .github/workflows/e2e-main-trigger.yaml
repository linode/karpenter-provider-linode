name: e2e-main-trigger

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read
  actions: read
  id-token: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      paths: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            src:
             - '**/**.go'
             - 'charts/**'
             - 'e2e/**'
             - 'Tiltfile'
             - 'justfile'
             - 'Makefile'
             - 'go.mod'
            workflow:
             - '.github/workflows/**'
             - '.github/actions/**'
            e2e_ci:
             - '.github/workflows/e2e*.y*ml'
             - '.github/actions/e2e/**'

  e2e-main-standard:
    name: Main E2E (standard)
    needs: [changes]
    if: ${{ contains(fromJSON(needs.changes.outputs.paths), 'src') || contains(fromJSON(needs.changes.outputs.paths), 'e2e_ci') }}
    uses: ./.github/workflows/e2e.yaml
    with:
      cluster_name: ${{ format('kps-{0}', github.run_id) }}
      cluster_tier: standard
      chainsaw_selector: pr
      cleanup: true
      timeout_minutes: 60
      cleanup_timeout_minutes: 20
      harden_runner_egress_policy: block
      harden_runner_allowed_endpoints: >-
        *.linodelke.net:443
        api.github.com:443
        api.linode.com:443
        api.segment.io:443
        auth.docker.io:443
        identity.docker.com:443
        files.pythonhosted.org:443
        gcr.io:443
        github.com:443
        index.docker.io:443
        ipv4.icanhazip.com:443
        linode.github.io:443
        pypi.org:443
        registry-1.docker.io:443
        release-assets.githubusercontent.com:443
        *.githubusercontent.com:443
        cdn.dl.k8s.io:443
        dl.google.com:443
        dl.k8s.io:443
        get.helm.sh:443
        mise-versions.jdx.dev:443
        mise.jdx.dev:443
        proxy.golang.org:443
        storage.googleapis.com:443
        sum.golang.org:443
        tuf-repo-cdn.sigstore.dev:443
    secrets: inherit

  e2e-main-enterprise:
    name: Main E2E (enterprise)
    needs: [changes]
    if: ${{ contains(fromJSON(needs.changes.outputs.paths), 'src') || contains(fromJSON(needs.changes.outputs.paths), 'e2e_ci') }}
    uses: ./.github/workflows/e2e.yaml
    with:
      cluster_name: ${{ format('kpe-{0}', github.run_id) }}
      cluster_tier: enterprise
      chainsaw_selector: pr
      cleanup: true
      timeout_minutes: 90
      cleanup_timeout_minutes: 20
      harden_runner_egress_policy: block
      harden_runner_allowed_endpoints: >-
        *.linodelke.net:443
        *.enterprise.linodelke.net:6443
        api.github.com:443
        api.linode.com:443
        api.segment.io:443
        auth.docker.io:443
        identity.docker.com:443
        cloud.tilt.dev:443
        files.pythonhosted.org:443
        gcr.io:443
        github.com:443
        index.docker.io:443
        ipv4.icanhazip.com:443
        linode.github.io:443
        pypi.org:443
        registry-1.docker.io:443
        release-assets.githubusercontent.com:443
        *.githubusercontent.com:443
        cdn.dl.k8s.io:443
        dl.google.com:443
        dl.k8s.io:443
        get.helm.sh:443
        mise-versions.jdx.dev:443
        mise.jdx.dev:443
        proxy.golang.org:443
        storage.googleapis.com:443
        sum.golang.org:443
        tuf-repo-cdn.sigstore.dev:443
    secrets: inherit

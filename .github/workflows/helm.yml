name: Helm

on:
  pull_request:
    paths:
      - 'charts/**'
  workflow_dispatch: {}
  release: {}

permissions:
  contents: read

jobs:
  helm-test:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            get.helm.sh:443
            github.com:443
            pypi.org:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            *.githubusercontent.com:443
            cdn.dl.k8s.io:443
            dl.google.com:443
            dl.k8s.io:443
            mise-versions.jdx.dev:443
            mise.jdx.dev:443
            proxy.golang.org:443
            storage.googleapis.com:443
            sum.golang.org:443
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          # yq stamps the chart metadata; ct lint drives helm under the hood.
          install_args: helm yq

      - name: Set Version
        run: |
          TAG=$(git describe --tags --abbrev=0)
          mise run set-chart-version "${TAG##*-}"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Run chart-testing (lint)
        run: ct lint --check-version-increment=false --chart-dirs charts --target-branch ${{ github.event.repository.default_branch }}

  helm-release:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: helm-test
    permissions:
      contents: write  # for helm/chart-releaser-action to push chart release and create a release
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
          allowed-endpoints: >
            api.github.com:443
            get.helm.sh:443
            github.com:443
            release-assets.githubusercontent.com:443
            uploads.github.com:443
            *.githubusercontent.com:443
            cdn.dl.k8s.io:443
            dl.google.com:443
            dl.k8s.io:443
            mise-versions.jdx.dev:443
            mise.jdx.dev:443
            proxy.golang.org:443
            storage.googleapis.com:443
            sum.golang.org:443
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          # yq stamps the chart metadata; chart-releaser packages with helm.
          install_args: helm yq

      - name: Set Version
        run: |
          TAG=$(git describe --tags --abbrev=0)
          mise run set-chart-version "${TAG##*-}"

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          CR_RELEASE_NAME_TEMPLATE: "helm-{{ .Name }}-{{ .Version }}"
        with:
          charts_dir: charts
          skip_existing: true
          mark_as_latest: false

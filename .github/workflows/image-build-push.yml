name: Image
on:
  push:
    branches:
      - "main"
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
          allowed-endpoints: >
            api.github.com:443
            api.segment.io:443
            auth.docker.io:443
            identity.docker.com:443
            gcr.io:443
            github.com:443
            index.docker.io:443
            proxy.golang.org:443
            registry-1.docker.io:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443
            *.githubusercontent.com:443
            *.blob.core.windows.net:443
            mise.jdx.dev:443
            mise-versions.jdx.dev:443
            tuf-repo-cdn.sigstore.dev:443
            dl.google.com:443
            dl.k8s.io:443
            cdn.dl.k8s.io:443
            get.helm.sh:443
            pypi.org:443
            files.pythonhosted.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ secrets.DOCKERHUB_OIDC_CONNECTIONID }}
        with:
          username: ${{ github.repository_owner }}

      - name: Set up Mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: go just ko

      - name: Build and push image with ko
        env:
          KO_DOCKER_REPO: docker.io/linode/karpenter-provider-linode
          IMAGE_TAGS: ${{ startsWith(github.ref, 'refs/tags/') && format('{0},latest', github.ref_name) || github.ref_name }}
        run: mise run build-karpl-image

name: CI
on:
  push:
    branches:
      - 'main'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-non-test-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      # Expose matched filters as job 'src' output variable
      src: ${{ steps.filter.outputs.src }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            src:
             - '**/**.go'
             - 'charts/**'
             - 'e2e/**'
             - 'Tiltfile'
             - 'justfile'
             - 'Makefile'
             - 'go.mod'
            workflow:
             - '.github/workflows/**'
             - '.github/actions/**'
            e2e_ci:
             - '.github/workflows/e2e*.y*ml'
             - '.github/actions/e2e/**'
  go-analyze:
    needs: changes
    runs-on: ubuntu-latest
    if: ${{ needs.changes.outputs.src == 'true' || needs.changes.outputs.workflow == 'true' }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            proxy.golang.org:443
            sum.golang.org:443
            golang.org:443
            go.dev:443
            *.githubusercontent.com:443
            production.cloudflare.docker.com:443
            vuln.go.dev:443
            storage.googleapis.com:443
            golangci-lint.run:443
            dl.k8s.io:443
            cdn.dl.k8s.io:443
            registry-1.docker.io:443
            auth.docker.io:443
            identity.docker.com:443
            mise.jdx.dev:443
            mise-versions.jdx.dev:443
            tuf-repo-cdn.sigstore.dev:443
            dl.google.com:443
            get.helm.sh:443
            pypi.org:443
            files.pythonhosted.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - run: mise run ci-non-test
        shell: bash

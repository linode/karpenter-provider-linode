name: e2e

on:
  workflow_call:
    inputs:
      environment:
        required: false
        type: string
        default: ''
      cluster_name:
        type: string
        required: true
      cluster_tier:
        type: string
        required: false
        default: standard
      chainsaw_selector:
        type: string
        required: true
      cleanup:
        type: boolean
        required: true
      timeout_minutes:
        type: number
        required: false
        default: 60
      cleanup_timeout_minutes:
        type: number
        required: false
        default: 20
      chainsaw_flags:
        type: string
        required: false
        default: --config .chainsaw.yaml
      harden_runner_egress_policy:
        type: string
        required: true
      harden_runner_allowed_endpoints:
        type: string
        required: true

env:
  E2E_STANDARD_CLEANUP_ALLOWED_ENDPOINTS: >-
    api.github.com:443
    api.linode.com:443
    api.segment.io:443
    files.pythonhosted.org:443
    github.com:443
    pypi.org:443
    release-assets.githubusercontent.com:443
    proxy.golang.org:443
    cdn.dl.k8s.io:443
    dl.google.com:443
    dl.k8s.io:443
    get.helm.sh:443
    mise-versions.jdx.dev:443
    mise.jdx.dev:443
    storage.googleapis.com:443
    sum.golang.org:443
    tuf-repo-cdn.sigstore.dev:443
    *.blob.core.windows.net:443
    *.githubusercontent.com:443
  E2E_ENTERPRISE_CLEANUP_ALLOWED_ENDPOINTS: >-
    api.github.com:443
    api.linode.com:443
    api.segment.io:443
    cloud.tilt.dev:443
    files.pythonhosted.org:443
    github.com:443
    pypi.org:443
    release-assets.githubusercontent.com:443
    proxy.golang.org:443
    dl.k8s.io:443
    dl.google.com:443
    storage.googleapis.com:443
    cdn.dl.k8s.io:443
    sum.golang.org:443
    get.helm.sh:443
    mise-versions.jdx.dev:443
    mise.jdx.dev:443
    tuf-repo-cdn.sigstore.dev:443
    *.blob.core.windows.net:443
    *.githubusercontent.com:443

permissions:
  contents: read
  pull-requests: read
  actions: read
  id-token: write

jobs:
  e2e:
    name: E2E (${{ inputs.cluster_tier }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    environment: ${{ inputs.environment }}
    env:
      LINODE_TOKEN: ${{ secrets.LINODE_TOKEN }}
      LINODE_CLI_TOKEN: ${{ secrets.LINODE_TOKEN }}
      LINODE_REGION: us-sea
      CLUSTER_NAME: ${{ inputs.cluster_name }}
      CLUSTER_TIER: ${{ inputs.cluster_tier }}
      CHAINSAW_SELECTOR: ${{ inputs.chainsaw_selector }}
      CHAINSAW_FLAGS: ${{ inputs.chainsaw_flags }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: ${{ inputs.harden_runner_egress_policy }}
          allowed-endpoints: ${{ inputs.harden_runner_allowed_endpoints }}

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build & Push KARPL Image for e2e
        uses: ./.github/actions/e2e
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ secrets.DOCKERHUB_OIDC_CONNECTIONID }}
        with:
          docker_username: ${{ github.repository_owner }}
          mise_task: build-karpl-image

      - name: E2E setup and test
        uses: ./.github/actions/e2e
        with:
          mise_task: setup-and-test-e2e

  cleanup:
    name: Cleanup (${{ inputs.cluster_tier }})
    if: ${{ inputs.cleanup && always() }}
    needs: [e2e]
    timeout-minutes: ${{ inputs.cleanup_timeout_minutes }}
    runs-on: ubuntu-latest
    env:
      LINODE_TOKEN: ${{ secrets.LINODE_TOKEN }}
      LINODE_CLI_TOKEN: ${{ secrets.LINODE_TOKEN }}
      CLUSTER_NAME: ${{ inputs.cluster_name }}
      CLUSTER_TIER: ${{ inputs.cluster_tier }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: ${{ inputs.cluster_tier == 'enterprise' && env.E2E_ENTERPRISE_CLEANUP_ALLOWED_ENDPOINTS || env.E2E_STANDARD_CLEANUP_ALLOWED_ENDPOINTS }}

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: E2E Cleanup
        uses: ./.github/actions/e2e
        with:
          cleanup_cluster: "true"

name: e2e-pr-cleanup-trigger

on:
  pull_request: # TODO: change this to pull_request_target so people don't need to set their own LINODE_TOKEN secret in their forks
    types: [closed]
    branches:
      - '**'

permissions:
  contents: read
  pull-requests: read
  actions: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cleanup-pr-close:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      LINODE_TOKEN: ${{ secrets.LINODE_TOKEN }}
      LINODE_CLI_TOKEN: ${{ secrets.LINODE_TOKEN }}
      CLUSTER_NAME: ${{ format('kpr-{0}', github.event.pull_request.number) }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            api.linode.com:443
            api.segment.io:443
            files.pythonhosted.org:443
            github.com:443
            pypi.org:443
            release-assets.githubusercontent.com:443
            *.githubusercontent.com:443
            cdn.dl.k8s.io:443
            dl.google.com:443
            dl.k8s.io:443
            get.helm.sh:443
            mise-versions.jdx.dev:443
            mise.jdx.dev:443
            proxy.golang.org:443
            storage.googleapis.com:443
            sum.golang.org:443
            tuf-repo-cdn.sigstore.dev:443
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: E2E Cleanup on PR Close
        uses: ./.github/actions/e2e
        with:
          cleanup_cluster: "true"
